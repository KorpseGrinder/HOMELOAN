# Docker Compose for Development
# Run: docker-compose -f docker-compose.dev.yml up --build
#
# Services:
# - Frontend: http://localhost:4200
# - Backend:  http://localhost:8080
# - Swagger:  http://localhost:8080/swagger-ui.html
#
# Login: admin / admin123

version: '3.8'

services:
  # Spring Boot Backend with H2 in-memory database
  hlms-backend:
    build:
      context: .
      dockerfile: hlms-deployment/docker/Dockerfile.backend
    container_name: hlms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local,mock
      - JAVA_OPTS=-Xms512m -Xmx1g
      - SERVER_PORT=8080
      # H2 in-memory database (no Oracle needed)
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:hlmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.h2.Driver
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.H2Dialect
      - SPRING_H2_CONSOLE_ENABLED=true
      - SPRING_H2_CONSOLE_PATH=/h2-console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - hlms-network

  # Angular Frontend served via NGINX
  hlms-frontend:
    build:
      context: .
      dockerfile: hlms-deployment/docker/Dockerfile.frontend
    container_name: hlms-frontend
    ports:
      - "4200:80"
    depends_on:
      hlms-backend:
        condition: service_healthy
    networks:
      - hlms-network

networks:
  hlms-network:
    driver: bridge
