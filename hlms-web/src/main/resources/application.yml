server:
  port: 8080
spring:
  application:
    name: hlms
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
hlms:
  security:
    jwt:
      secret: hlms-super-secret-key-that-must-be-at-least-256-bits-long-for-hmac-sha
      access-token-expiration-ms: 900000
      refresh-token-expiration-ms: 28800000
    encryption:
      key: dGhpc2lzYXRlc3RrZXkxMjM0NTY3OA==
  document:
    storage:
      base-path: /tmp/hlms/documents
      max-file-size-bytes: 10485760
      allowed-extensions: pdf,jpg,jpeg,png,doc,docx
