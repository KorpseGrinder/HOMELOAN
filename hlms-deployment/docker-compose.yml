version: '3.8'
services:
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: hlms-oracle
    environment:
      ORACLE_PASSWORD: oracle_password
      APP_USER: hlms_app
      APP_USER_PASSWORD: hlms_password
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
  hlms-backend:
    build:
      context: ..
      dockerfile: hlms-deployment/docker/Dockerfile.backend
    container_name: hlms-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev,mock
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@oracle-db:1521/XEPDB1
      SPRING_DATASOURCE_USERNAME: hlms_app
      SPRING_DATASOURCE_PASSWORD: hlms_password
    depends_on:
      - oracle-db
volumes:
  oracle_data:
